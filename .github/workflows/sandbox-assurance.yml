name: Sandbox Assurance

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assure:
    name: Assurance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install assurance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq ruby

      - name: Run sandbox assurance
        env:
          VERSION: ci-${{ github.sha }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/assure-sandbox.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gofmt, vet, staticcheck, go fix drift
        run: |
          make fix-check vet lint
          test -z "$(gofmt -l .)" || { echo "gofmt needed on:"; gofmt -l .; exit 1; }
