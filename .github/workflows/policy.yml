name: policy

# MANAGED BY personal/standards - edit the template there, not this copy.
# Version lives in .github/standards.lock, so a bump does not churn this file.
# A local edit here is not lost: `standards status` reports it as modified and
# `standards harvest` promotes it into the template for every repo.
#
# One billed job for the three PR policy gates. GitHub rounds each job up to
# a minute, so three 20-second workflows cost three minutes; this costs one.
# Job name `Policy` is the required status check (CHECK_FROM_TEMPLATE).
#
#   lint     blocking: squash commits are composed from the PR title + body
#            server-side, so the commit-msg hook never sees what lands on main
#   size     advisory: prints reviewable lines, warns past ~400
#   gitleaks private repos only (github.event.repository.private). Public
#            repos use GitHub push protection; a skipped step is not a skip
#            of the job, so the required check still reports.
#
# `edited` is load-bearing. Fixing a rejected title is an edit, not a push.
# No `paths:` filter: a path-filtered required check never reports and
# deadlocks the branch.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write # SARIF upload

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks: a secret removed later is still leaked

      - name: Lint PR title and body
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          TITLE_MODE: "subject-conventional"
        # Dependabot cannot satisfy conventional subjects: the configured
        # prefix becomes `deps(scope)`, which is not a conventional type, and
        # grouped updates run past the 72-char cap. Machine-generated text
        # carries no attribution risk, so it gets the shared content bans
        # without the subject format.
        #
        # Do not skip the job with a job-level `if`. A required check that
        # never reports deadlocks the branch exactly like a path-filtered one.
        #
        # The body is the dependency's own release notes, pasted verbatim. A
        # faraday changelog crediting @Copilot tripped the AI-mention ban on
        # markwise PR #270. That is quoted third-party text, not a claim this
        # repo is making. Greptile appends the same class of text after
        # `<!-- greptile_comment -->`; strip it before scanning.
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            printf '%s\n' "$TITLE" | bash scripts/lint-message.sh
          elif [ "$TITLE_MODE" = "subject-conventional" ]; then
            printf '%s\n' "$TITLE" | bash scripts/lint-message.sh --subject-conventional
          else
            printf '%s\n' "$TITLE" | bash scripts/lint-message.sh
          fi
          printf '%s\n' "$BODY" | sed '/<!-- greptile_comment -->/,$d' | bash scripts/lint-message.sh

      - name: Self-check the rules
        if: github.event_name == 'pull_request'
        # A gate is not done until you have watched it fail. These run on every
        # PR rather than in a separate suite because the script is the gate:
        # if a carve-out regresses, this job should be the thing that says so.
        run: |
          set -euo pipefail
          expect() {
            local want="$1" name="$2" text="$3"; shift 3
            if printf '%s' "$text" | bash scripts/lint-message.sh "$@" >/dev/null 2>&1; then got=pass; else got=fail; fi
            [ "$got" = "$want" ] || { echo "::error::lint-message self-check: '$name' expected $want, got $got"; exit 1; }
          }
          expect fail "em dash"            "Add a thing — with a dash"
          expect fail "ai attribution"     "Written by claude"
          expect fail "bare model credit"  "Written by GPT-5"
          expect fail "filler word"        "Enhance the robust pipeline"
          expect fail "seamless"           "A seamless checkout"
          expect fail "comprehensive"      "A comprehensive rewrite"
          expect fail "generated by"       "Generated by the assistant"
          expect fail "co-authored-by"     "Co-Authored-By: someone <a@b.c>"
          expect pass "dated model id"     "Pin gpt-5.4-mini-2026-03-17 as the default"
          expect pass "named model id"     "Price gpt-5.6-terra at the standard tier"
          expect pass "conventions doc"    "Update CLAUDE.md gate table"
          expect fail "plain subject"      "Add a thing" --subject-conventional
          expect pass "conventional"       "feat(api): add a thing" --subject-conventional
          expect fail "subject full stop"  "feat(api): add a thing." --subject-conventional
          # The dependabot path above runs without --subject-conventional. This
          # pins what that buys: a `deps(...)` title clears the bans, and would
          # not clear the subject format.
          expect pass "dependabot title"   "deps(web): bump pako from 2.2.0 to 3.0.0 in /web"
          expect fail "dependabot as human" "deps(web): bump pako from 2.2.0 to 3.0.0 in /web" --subject-conventional
          echo "self-check: 17/17"

      - name: Count reviewable lines
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          lines=$(git diff --numstat "$BASE" "$HEAD" -- \
            ':(exclude)**/go.sum' \
            ':(exclude)**/*.gen.go' \
            ':(exclude)**/vendor/**' \
            | awk '$1 != "-" { total += $1 + $2 } END { print total + 0 }')
          echo "Reviewable diff: ${lines} lines"
          echo "### Reviewable diff: ${lines} lines" >> "$GITHUB_STEP_SUMMARY"
          if [ "$lines" -gt 400 ]; then
            echo "::warning::${lines} reviewable lines. Past ~400 a single reviewer skims instead of reads, consider splitting."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Past ~400 lines a single reviewer skims instead of reads. Splitting is usually cheaper than the bug you miss." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Gitleaks
        if: github.event.repository.private
        # gitleaks/gitleaks-action v2 - SHA-pinned, third-party action
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Upload SARIF report
        if: failure() && github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Explain the failure
        if: failure() && github.event.repository.private
        run: |
          echo "::error::Secrets detected. Rotate the key first, then remove it from history."
          echo "Findings are in the Security tab (SARIF, category: gitleaks)."
          echo "Removing the commit is not enough - assume anything pushed is compromised."
          exit 1
