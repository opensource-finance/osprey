name: Bug report
description: Report a defect in the Osprey engine
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **For security vulnerabilities, do not use this form** — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal request body and/or rule that triggers it is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `osprey --version` (or the `version` field on `GET /health`).
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Evaluation mode
      options:
        - detection
        - compliance
        - not sure
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
