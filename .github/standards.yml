# Policy for personal/standards. Templates live there; this file is the
# per-repo authority for what we accept and how it is rendered.
# Gitleaks steps in policy.yml no-op on public repos (repository.private).
# GitHub push protection stays the secret gate here.
manages:
  - policy
  - lint-message
vars:
  PR_LINT_TITLE_MODE: subject-conventional
  PR_SIZE_EXCLUDES:
    - "**/go.sum"
    - "**/*.gen.go"
    - "**/vendor/**"
settings:
  extra_checks:
    - check
    - Unit Tests & Coverage
    - Integration Tests
    - Assurance Gate
