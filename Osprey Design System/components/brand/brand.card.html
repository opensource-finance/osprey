<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 0; background: var(--background); font-family: var(--font-sans); }
  .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 260px; }
  .light { padding: 32px; display: flex; flex-direction: column; gap: 22px; justify-content: center; }
  .dark { background: var(--ink); padding: 32px; display: flex; flex-direction: column; gap: 22px; justify-content: center; }
  .cap { font-size: var(--text-2xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { OspreyMark, Wordmark } = window.OpensourceFinanceOspreyDesignSystem_08d2ca;
  function Demo() {
    return (
      <div className="split">
        <div className="light">
          <span className="cap">Glyph</span>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <OspreyMark size={40} />
            <OspreyMark size={28} />
            <OspreyMark size={20} />
          </div>
          <span className="cap">Lockups</span>
          <Wordmark brand="osf" size={20} />
          <Wordmark brand="osprey" size={20} />
        </div>
        <div className="dark">
          <span className="cap" style={{ color: "rgba(255,255,255,0.5)" }}>On dark</span>
          <Wordmark brand="osf" size={22} color="#fff" />
          <Wordmark brand="osf" dot="circle" size={18} color="#fff" />
          <Wordmark brand="osprey" size={20} color="#fff" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
