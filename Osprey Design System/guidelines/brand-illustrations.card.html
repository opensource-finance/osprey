<!-- @dsCard group="Brand" viewport="900x720" name="Brand illustrations" subtitle="Line-icon set — open source · community · finance · vigilance" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Osprey — Brand Illustrations</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  :root {
    /* Illustration tile palette — earthy editorial set rooted in DS hues.
       Bold tiles carry cream icons; light tiles carry ink + a brand-red accent dot. */
    --ill-ink: #1C1C1A;
    --ill-cream: #F2EFE6;
    --ill-red: #C2492E;            /* deepened swiss-red accent (brand dot) */
    --t-cream: #F1EEE4;
    --t-sage: #D9E6DC;
    --t-mint: #E4EDE8;
    --t-blush: #F2E3DB;
    --t-slateblue: #DCE3EC;
    --t-lavender: #E3E0EB;
    --t-yellow: #EFE8C6;
    --t-red: #B14A30;
    --t-teal: #1E4F46;
    --t-forest: #21352C;
    --t-slate: #33485B;
    --t-olive: #7C6A2C;
  }
  body { margin: 0; padding: 40px 36px 56px; background: #FAFAF7; font-family: var(--font-sans); color: var(--ill-ink); }
  header { max-width: 1080px; margin: 0 auto 32px; }
  .eyebrow { font-size: var(--text-2xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--ill-red); }
  h1 { font-size: var(--text-4xl); font-weight: 500; letter-spacing: var(--tracking-tighter); margin: 8px 0 0; }
  h1 .em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--ill-red); }
  .sub { font-size: var(--text-lg); color: var(--text-muted); margin: 10px 0 0; max-width: 56ch; line-height: var(--leading-relaxed); }
  .group-label { max-width: 1080px; margin: 36px auto 14px; font-size: var(--text-2xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); }
  .grid { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .tile { display: flex; flex-direction: column; align-items: center; }
  .face { width: 100%; aspect-ratio: 1 / 1; border-radius: 18px; display: flex; align-items: center; justify-content: center; transition: transform .35s var(--ease-out); }
  .tile:hover .face { transform: translateY(-3px); }
  .face svg { width: 56%; height: 56%; }
  .face svg [data-stroke] { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .face svg [data-fill] { fill: currentColor; stroke: none; }
  .label { margin-top: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Brand illustrations</div>
  <h1>The shape of <span class="em">vigilance</span>.</h1>
  <p class="sub">A single-weight line set drawn for opensource.finance — the soul of the product in four pillars: open source, community, finance, and the watchful eye of Osprey.</p>
</header>
<div id="root"></div>

<script>
  const ICONS = [
    // ---------- VIGILANCE / OSPREY ----------
    { g: "Vigilance · Osprey", id: "osprey", label: "Osprey", tile: "--t-red", ink: "cream", svg: `
      <path data-stroke d="M24 4 L8 12 V23 C8 34 15 42 24 44 C33 42 40 34 40 23 V12 Z" opacity="0.35"/>
      <path data-stroke d="M24 15 V33"/>
      <path data-stroke d="M16.5 20 L31.5 28"/>
      <path data-stroke d="M16.5 28 L31.5 20"/>
      <circle data-fill cx="24" cy="24" r="3"/>` },
    { g: "Vigilance · Osprey", id: "monitor", label: "Monitor", tile: "--t-cream", ink: "ink", svg: `
      <circle data-stroke cx="24" cy="24" r="14"/>
      <circle data-stroke cx="24" cy="24" r="8.5"/>
      <circle data-fill data-accent cx="24" cy="24" r="3"/>` },
    { g: "Vigilance · Osprey", id: "signal", label: "Signal", tile: "--t-sage", ink: "ink", svg: `
      <circle data-fill data-accent cx="24" cy="24" r="2.6"/>
      <path data-stroke d="M18.5 18.5 A8 8 0 0 0 18.5 29.5"/>
      <path data-stroke d="M29.5 18.5 A8 8 0 0 1 29.5 29.5"/>
      <path data-stroke d="M14 13 A14.5 14.5 0 0 0 14 35"/>
      <path data-stroke d="M34 13 A14.5 14.5 0 0 1 34 35"/>` },
    { g: "Vigilance · Osprey", id: "verified", label: "Verified", tile: "--t-slate", ink: "cream", svg: `
      <path data-stroke d="M24 5 L9 11 V24 C9 33 15 41 24 44 C33 41 39 33 39 24 V11 Z"/>
      <path data-stroke d="M17 24 L22 29 L31.5 18.5"/>` },
    { g: "Vigilance · Osprey", id: "alert", label: "Alert", tile: "--t-mint", ink: "ink", svg: `
      <circle data-fill data-accent cx="24" cy="24" r="2.6"/>
      <path data-stroke d="M28 24L39 24 M27.46 26L36.99 31.5 M26 27.46L31.5 36.99 M24 28L24 39 M22 27.46L16.5 36.99 M20.54 26L11 31.5 M20 24L9 24 M20.54 22L11 16.5 M22 20.54L16.5 11 M24 20L24 9 M26 20.54L31.5 11 M27.46 22L36.99 16.5"/>` },
    { g: "Vigilance · Osprey", id: "scrutiny", label: "Scrutiny", tile: "--t-blush", ink: "ink", svg: `
      <path data-stroke d="M13 8 H27 L33 14 V40 H13 Z"/>
      <path data-stroke d="M27 8 V14 H33"/>
      <path data-stroke d="M18 18 H26 M18 22.5 H24"/>
      <circle data-stroke cx="26.5" cy="30" r="6"/>
      <path data-stroke d="M31 34.5 L36 39.5"/>` },

    // ---------- OPEN SOURCE ----------
    { g: "Open source", id: "open-source", label: "Open Source", tile: "--t-cream", ink: "ink", svg: `
      <path data-stroke d="M19 11 C14 11 16.5 22 11 24 C16.5 26 14 37 19 37"/>
      <path data-stroke d="M29 11 C34 11 31.5 22 37 24 C31.5 26 34 37 29 37"/>` },
    { g: "Open source", id: "binary", label: "Binary", tile: "--t-olive", ink: "cream", svg: `
      <path data-stroke d="M10 12 H38 A3 3 0 0 1 41 15 V35 A3 3 0 0 1 38 38 H10 A3 3 0 0 1 7 35 V15 A3 3 0 0 1 10 12 Z"/>
      <path data-stroke d="M14 22 L19 26 L14 30"/>
      <path data-stroke d="M23 30 H31"/>` },
    { g: "Open source", id: "fork", label: "Fork", tile: "--t-slateblue", ink: "ink", svg: `
      <circle data-stroke cx="14" cy="12" r="4"/>
      <circle data-stroke cx="34" cy="12" r="4"/>
      <circle data-stroke cx="24" cy="37" r="4"/>
      <path data-stroke d="M24 33 V27"/>
      <path data-stroke d="M24 27 C24 20 14 21 14 16"/>
      <path data-stroke d="M24 27 C24 20 34 21 34 16"/>` },
    { g: "Open source", id: "unlock", label: "Open", tile: "--t-blush", ink: "ink", svg: `
      <path data-stroke d="M13 22 H35 A2 2 0 0 1 37 24 V38 A2 2 0 0 1 35 40 H13 A2 2 0 0 1 11 38 V24 A2 2 0 0 1 13 22 Z"/>
      <path data-stroke d="M16 22 V15 A8 8 0 0 1 30.5 10.5"/>
      <circle data-fill data-accent cx="24" cy="29" r="2.4"/>
      <path data-stroke d="M24 31 V35"/>` },
    { g: "Open source", id: "global", label: "Global", tile: "--t-teal", ink: "cream", svg: `
      <circle data-stroke cx="24" cy="24" r="15"/>
      <path data-stroke d="M24 9 C16 14 16 34 24 39 C32 34 32 14 24 9 Z"/>
      <path data-stroke d="M9.5 19 H38.5 M9 24 H39 M9.5 29 H38.5"/>` },
    { g: "Open source", id: "deploy", label: "Deploy", tile: "--t-sage", ink: "ink", svg: `
      <path data-stroke d="M24 6 C30 10 33 16 33 24 L33 31 L15 31 L15 24 C15 16 18 10 24 6 Z"/>
      <circle data-stroke cx="24" cy="20" r="3.5"/>
      <path data-stroke d="M15 31 L11 37 M33 31 L37 37 M20 35 L20 40 M28 35 L28 40 M24 34 L24 41"/>` },

    // ---------- COMMUNITY ----------
    { g: "Community", id: "community", label: "Community", tile: "--t-forest", ink: "cream", svg: `
      <circle data-stroke cx="24" cy="15" r="4.5"/>
      <path data-stroke d="M15 35 C15 27 33 27 33 35"/>
      <circle data-stroke cx="11" cy="20" r="3.2"/>
      <path data-stroke d="M5 33 C5 28 11 27 14.5 29"/>
      <circle data-stroke cx="37" cy="20" r="3.2"/>
      <path data-stroke d="M43 33 C43 28 37 27 33.5 29"/>` },
    { g: "Community", id: "network", label: "Network", tile: "--t-cream", ink: "ink", svg: `
      <path data-stroke d="M24 24 L10 15 M24 24 L38 15 M24 24 L13 37 M24 24 L35 37"/>
      <circle data-stroke cx="10" cy="14" r="3.4"/>
      <circle data-stroke cx="38" cy="14" r="3.4"/>
      <circle data-stroke cx="12" cy="38" r="3.4"/>
      <circle data-stroke cx="36" cy="38" r="3.4"/>
      <circle data-fill data-accent cx="24" cy="24" r="3.4"/>` },
    { g: "Community", id: "contribute", label: "Contribute", tile: "--t-lavender", ink: "ink", svg: `
      <circle data-stroke cx="24" cy="24" r="15"/>
      <path data-stroke d="M24 30 C18 26 17 21 20 18.5 C22 16.8 24 18 24 19.5 C24 18 26 16.8 28 18.5 C31 21 30 26 24 30 Z"/>` },

    // ---------- FINANCE ----------
    { g: "Finance", id: "balance", label: "Balance", tile: "--t-mint", ink: "ink", svg: `
      <path data-stroke d="M24 11 V39"/>
      <path data-stroke d="M17 40 H31"/>
      <path data-stroke d="M12 16 H36"/>
      <circle data-fill data-accent cx="24" cy="11" r="2.4"/>
      <path data-stroke d="M12 16 L7 26 M12 16 L17 26 M7 26 A6 6 0 0 0 17 26"/>
      <path data-stroke d="M36 16 L31 26 M36 16 L41 26 M31 26 A6 6 0 0 0 41 26"/>` },
    { g: "Finance", id: "funds", label: "Funds", tile: "--t-yellow", ink: "ink", svg: `
      <ellipse data-stroke cx="24" cy="14" rx="11" ry="4"/>
      <path data-stroke d="M13 14 V21 M35 14 V21 M13 21 A11 4 0 0 0 35 21"/>
      <path data-stroke d="M13 21 V28 M35 21 V28 M13 28 A11 4 0 0 0 35 28"/>
      <path data-stroke d="M13 28 V35 M35 28 V35 M13 35 A11 4 0 0 0 35 35"/>` },
    { g: "Finance", id: "records", label: "Records", tile: "--t-teal", ink: "cream", svg: `
      <path data-stroke d="M24 14 C20 11 12 11 8 13 V36 C12 34 20 34 24 37 C28 34 36 34 40 36 V13 C36 11 28 11 24 14 Z"/>
      <path data-stroke d="M24 14 V37"/>
      <path data-stroke d="M12 19 H19 M12 24 H19 M29 19 H36 M29 24 H36"/>` },
    { g: "Finance", id: "transfer", label: "Transfer", tile: "--t-slateblue", ink: "ink", svg: `
      <circle data-stroke cx="12" cy="24" r="4"/>
      <circle data-fill data-accent cx="36" cy="24" r="4"/>
      <path data-stroke d="M16 19 C22 13 30 13 35 18 M33 14 L35.5 18 L31.5 19.5"/>
      <path data-stroke d="M32 29 C26 35 18 35 13 30 M15 34 L12.5 30 L16.5 28.5"/>` },
  ];

  const root = document.getElementById("root");
  const order = ["Vigilance · Osprey", "Open source", "Community", "Finance"];
  for (const g of order) {
    const lbl = document.createElement("div");
    lbl.className = "group-label";
    lbl.textContent = g;
    root.appendChild(lbl);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const ic of ICONS.filter((x) => x.g === g)) {
      const isDark = ic.ink === "cream";
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.innerHTML = `
        <div class="face" style="background:var(${ic.tile}); color:${isDark ? "var(--ill-cream)" : "var(--ill-ink)"}">
          <svg viewBox="0 0 48 48">${ic.svg}</svg>
        </div>
        <div class="label">${ic.label}</div>`;
      // brand-red accent only on light tiles; on dark tiles fold accent into currentColor
      if (isDark) tile.querySelectorAll("[data-accent]").forEach((el) => el.removeAttribute("data-accent"));
      else tile.querySelectorAll("[data-accent]").forEach((el) => { el.style.fill = "var(--ill-red)"; el.style.stroke = "var(--ill-red)"; });
      grid.appendChild(tile);
    }
    root.appendChild(grid);
  }
</script>
</body>
</html>
