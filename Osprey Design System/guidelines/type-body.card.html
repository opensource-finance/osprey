<!-- @dsCard group="Type" viewport="700x190" name="Body & weights" subtitle="DM Sans 300–700, relaxed measure" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--background); font-family: var(--font-sans); color: var(--foreground); }
  p { max-width: 46ch; font-size: var(--text-lg); line-height: var(--leading-relaxed); color: var(--text-muted); margin: 0 0 16px; }
  p strong { color: var(--foreground); font-weight: 500; }
  .weights { display: flex; gap: 22px; font-size: var(--text-xl); }
  .weights span { letter-spacing: var(--tracking-tight); }
</style></head>
<body>
  <p>I built <strong>Osprey</strong> to fulfill the original promise of equity — re-engineered into a single, efficient binary. No massive integration projects. No enterprise bloat.</p>
  <div class="weights">
    <span style="font-weight:300">Light</span>
    <span style="font-weight:400">Regular</span>
    <span style="font-weight:500">Medium</span>
    <span style="font-weight:600">Semibold</span>
    <span style="font-weight:700">Bold</span>
  </div>
</body>
</html>
