<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows" subtitle="Subtle, cool, blue-black. Floating UI goes deeper." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; gap: 26px; }
  .item { text-align: center; }
  .box { width: 96px; height: 70px; background: var(--surface-card); border-radius: var(--radius-lg); }
  .t { font-size: var(--text-2xs); font-family: var(--font-mono); color: var(--text-muted); margin-top: 12px; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="t">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="t">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="t">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="t">xl</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-2xl)"></div><div class="t">2xl</div></div>
  </div>
</body>
</html>
