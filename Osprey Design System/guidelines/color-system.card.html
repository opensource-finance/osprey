<!-- @dsCard group="Colors" viewport="700x150" name="System palette" subtitle="Apple-style blue / green / amber on slate — interactive product UI" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid var(--border-soft); }
  .name { font-size: var(--text-sm); font-weight: 600; margin-top: 8px; }
  .val { font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--sys-blue)"></div><div class="name">Blue</div><div class="val">#007AFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--sys-green)"></div><div class="name">Green</div><div class="val">#34C759</div></div>
    <div class="sw"><div class="chip" style="background:var(--sys-amber)"></div><div class="name">Amber</div><div class="val">#F5A623</div></div>
    <div class="sw"><div class="chip" style="background:var(--sys-slate)"></div><div class="name" style="color:var(--text-muted)">Slate</div><div class="val">#0F172A</div></div>
    <div class="sw"><div class="chip" style="background:var(--sys-mist)"></div><div class="name">Mist</div><div class="val">#F5F5F7</div></div>
  </div>
</body>
</html>
