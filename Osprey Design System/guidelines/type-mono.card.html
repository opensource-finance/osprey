<!-- @dsCard group="Type" viewport="700x150" name="Mono — the log stream" subtitle="JetBrains Mono, reserved for the Osprey terminal" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--sys-slate); font-family: var(--font-mono); font-size: var(--text-sm); color: var(--terminal-text); }
  .l { display: flex; justify-content: space-between; padding: 3px 0; }
  .ok { color: var(--sys-green); font-weight: 700; }
  .warn { color: var(--sys-amber); font-weight: 700; }
</style></head>
<body>
  <div class="l"><span>ORIGIN_IP: 192.168.1.42 (US-WEST)</span><span class="ok">OK</span></div>
  <div class="l"><span>DEVICE_SIG: SHA-256 MATCH</span><span class="ok">OK</span></div>
  <div class="l"><span>BEHAVIOR_MODEL: DEVIATION +0.7σ</span><span class="warn">WARN</span></div>
  <div class="l"><span>RISK_SCORE: 12.4 (THRESHOLD 85)</span><span class="ok">OK</span></div>
</body>
</html>
