<!-- @dsCard group="Type" viewport="700x180" name="Display — the signature headline" subtitle="DM Sans medium, tracking-tighter, one italic-serif accent word" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--background); }
  h1 { font-family: var(--font-sans); font-weight: var(--weight-medium); letter-spacing: var(--tracking-tighter); line-height: var(--leading-tight); font-size: 3.25rem; color: var(--foreground); margin: 0; }
  .accent { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--primary); padding-right: 0.08em; }
</style></head>
<body>
  <h1>Transaction monitoring for <span class="accent">everyone</span> who isn't a bank.</h1>
</body>
</html>
