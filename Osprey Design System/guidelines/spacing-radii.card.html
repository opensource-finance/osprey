<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Soft & generous — pills for chrome, big radii for cards" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 18px; }
  .item { text-align: center; }
  .box { width: 72px; height: 72px; background: var(--surface-sunken); border: 1px solid var(--border); }
  .t { font-size: var(--text-2xs); font-family: var(--font-mono); color: var(--text-muted); margin-top: 8px; }
  .pill { width: 110px; height: 44px; background: var(--primary); border-radius: var(--radius-pill); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="t">sm · 8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="t">md · 12</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="t">xl · 24</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="t">2xl · 32</div></div>
    <div class="item"><div class="pill"></div><div class="t">pill · ∞</div></div>
  </div>
</body>
</html>
