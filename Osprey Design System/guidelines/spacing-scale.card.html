<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px grid — section rhythm runs 96–128px" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--primary); border-radius: 3px; width: 28px; }
  .t { font-size: var(--text-2xs); font-family: var(--font-mono); color: var(--text-muted); margin-top: 6px; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><div class="t">2 · 8</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="t">4 · 16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="t">6 · 24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="t">8 · 32</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="t">12 · 48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="t">16 · 64</div></div>
    <div class="item"><div class="bar" style="height:88px"></div><div class="t">24 · 96</div></div>
  </div>
</body>
</html>
