<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="DM Sans ramp — 10px micro-label up to display" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--background); font-family: var(--font-sans); color: var(--foreground); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; }
  .tag { width: 56px; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-muted); flex-shrink: 0; }
  .s { letter-spacing: var(--tracking-tight); font-weight: 500; }
</style></head>
<body>
  <div class="line"><span class="tag">6xl/60</span><span class="s" style="font-size:var(--text-6xl);letter-spacing:var(--tracking-tighter)">Vigilance</span></div>
  <div class="line"><span class="tag">4xl/36</span><span class="s" style="font-size:var(--text-4xl)">The Uncomfortable Truth</span></div>
  <div class="line"><span class="tag">2xl/24</span><span class="s" style="font-size:var(--text-2xl)">Single Binary deployment</span></div>
  <div class="line"><span class="tag">lg/18</span><span class="s" style="font-size:var(--text-lg);font-weight:400">Built in Go. No enterprise bloat.</span></div>
  <div class="line"><span class="tag">base/16</span><span class="s" style="font-size:var(--text-base);font-weight:400">Body — own your data.</span></div>
  <div class="line"><span class="tag">2xs/10</span><span class="s" style="font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-wider);font-weight:700;color:var(--text-muted)">Active Interception</span></div>
</body>
</html>
