<!-- @dsCard group="Colors" viewport="700x160" name="Dark mode" subtitle="Deep charcoal — not pitch black. Add .dark to scope." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  .dark { padding: 24px; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .name { font-size: var(--text-xs); font-weight: 600; margin-top: 8px; color: var(--foreground); }
  .val { font-size: var(--text-2xs); color: var(--text-muted); font-family: var(--font-mono); }
</style></head>
<body>
  <div class="dark">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--background)"></div><div class="name">background</div><div class="val">charcoal</div></div>
      <div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="name">surface-card</div><div class="val">.18</div></div>
      <div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="name">sunken</div><div class="val">.22</div></div>
      <div class="sw"><div class="chip" style="background:var(--primary)"></div><div class="name">primary</div><div class="val">lifted red</div></div>
      <div class="sw"><div class="chip" style="background:var(--foreground)"></div><div class="name">foreground</div><div class="val">.98</div></div>
    </div>
  </div>
</body>
</html>
