<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px; background: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 14px; justify-content: center; min-height: 120px; }
  .q { font-size: var(--text-2xl); font-weight: 500; letter-spacing: var(--tracking-tight); color: #fff; line-height: 1.25; }
  .q .em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--sys-blue); }
  .sub { font-size: var(--text-sm); color: rgba(255,255,255,0.55); font-family: var(--font-mono); }
</style></head>
<body>
  <div class="q">Banks have Tazama.<br/>Everyone <span class="em">else</span> has Osprey.</div>
  <div class="sub">// short. punchy. proof in numbers. the osprey never misses.</div>
</body>
</html>
