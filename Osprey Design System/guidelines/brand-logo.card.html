<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-sans); display: grid; grid-template-columns: 1fr 1fr; min-height: 180px; }
  .cell { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .dark { background: var(--ink); }
  .wm { font-weight: 700; letter-spacing: var(--tracking-tight); font-size: var(--text-2xl); }
</style></head>
<body>
  <div class="cell">
    <img src="../assets/brand/osprey-mark.svg" width="56" height="56" alt="Osprey" />
    <span class="wm" style="color:var(--foreground)">OSPREY</span>
  </div>
  <div class="cell dark">
    <img src="../assets/brand/osprey-mark.svg" width="40" height="40" alt="Osprey" />
    <span class="wm" style="color:#fff">OSPREY</span>
  </div>
</body>
</html>
