<!-- @dsCard group="Brand" viewport="700x180" name="The dot motif" subtitle="A tiny Swiss-red square is the lightweight signature" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px; background: var(--background); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 22px; }
  .mk { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: var(--tracking-tight); font-size: var(--text-2xl); color: var(--foreground); }
  .sq { width: 14px; height: 14px; background: var(--primary); border-radius: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: var(--radius-pill); border: 1px solid color-mix(in oklch, var(--primary) 20%, transparent); background: var(--primary-soft); color: var(--primary); font-size: var(--text-sm); font-weight: 500; width: fit-content; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
</style></head>
<body>
  <div class="mk"><span class="sq"></span>opensource.finance</div>
  <div class="badge"><span class="dot"></span>Introducing Osprey</div>
</body>
</html>
