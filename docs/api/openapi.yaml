openapi: 3.1.0
info:
  title: Osprey Sandbox API
  version: 0.1.0
  description: The API contract that customers use with the Osprey sandbox environment.
servers:
  - url: http://localhost:8080
    description: The local sandbox. Replace this URL with the base URL of your deployed Osprey.
tags:
  - name: Health
  - name: Evaluation
  - name: Rules
  - name: Typologies
security:
  - TenantHeader: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Get the health status.
      security: []
      responses:
        "200":
          description: The health of the service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      summary: Get the readiness status for traffic.
      security: []
      responses:
        "200":
          description: The service is ready for traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: The service is not ready. For example, compliance mode has no typologies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
  /evaluate:
    post:
      tags: [Evaluation]
      summary: Evaluate a transaction.
      security:
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
            examples:
              normal:
                summary: A normal transaction.
                externalValue: ../examples/evaluate-normal.json
              alert:
                summary: A transaction that causes a same-party alert.
                externalValue: ../examples/evaluate-alert.json
      responses:
        "200":
          description: The evaluation decision. If a CEL rule causes an error, the status is `ALRT` and `reasons` shows the error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This tenant already has a transaction with this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Osprey could not evaluate the transaction or save the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Compliance mode is not ready because typologies are missing, or the typology set changed during evaluation. Retry the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evaluations/{id}:
    get:
      tags: [Evaluation]
      summary: Get a saved evaluation.
      security:
        - TenantHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The saved evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        "404":
          description: The evaluation does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Osprey could not read from the repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transactions/{id}:
    get:
      tags: [Evaluation]
      summary: Get a saved transaction.
      security:
        - TenantHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The saved transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: The transaction does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Osprey could not read from the repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rules:
    get:
      tags: [Rules]
      summary: List the rules in the active engine.
      security:
        - TenantHeader: []
      responses:
        "200":
          description: The active rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRulesResponse"
    post:
      tags: [Rules]
      summary: Create or update a rule and make it active immediately.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleConfig"
            examples:
              sameParty:
                summary: A rule that checks for the same party.
                externalValue: ../examples/rule-same-party.json
      responses:
        "201":
          description: Osprey saved and loaded the rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleMutationResponse"
        "400":
          description: The rule is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The repository is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rules/variables:
    get:
      tags: [Rules]
      summary: List the CEL variables that rule expressions can use. This list is the canonical engine catalog.
      security:
        - TenantHeader: []
      responses:
        "200":
          description: The available variables.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  variables:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        type: { type: string }
                        group: { type: string }
                        access: { type: string }
                        note: { type: string }
                        description: { type: string }
  /rules/{id}:
    get:
      tags: [Rules]
      summary: Get an active rule.
      security:
        - TenantHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The active rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleConfig"
        "404":
          description: The active engine does not have this rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Rules]
      summary: Update a rule and make the changes active immediately.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/Force"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleConfig"
      responses:
        "200":
          description: Osprey updated and loaded the rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleMutationResponse"
        "400":
          description: The rule is not valid. For example, the request body has no `enabled` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            A loaded typology uses this rule, so you cannot disable it.
            Remove the typology reference, or send the request again with `?force=true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Rules]
      summary: Delete a rule and remove it from the active engine.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Osprey deleted the rule and reloaded the engine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The rule does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A loaded typology uses this rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rules/reload:
    post:
      tags: [Rules]
      summary: Reload rules from the repository into the active engine.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      responses:
        "200":
          description: Osprey reloaded the rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The repository is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /typologies:
    get:
      tags: [Typologies]
      summary: List the typologies in the active engine.
      security:
        - TenantHeader: []
      responses:
        "200":
          description: The active typologies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTypologiesResponse"
    post:
      tags: [Typologies]
      summary: Create a typology and make it active immediately.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Typology"
            examples:
              sameParty:
                summary: A verification typology.
                externalValue: ../examples/typology-same-party.json
      responses:
        "201":
          description: Osprey saved and loaded the typology.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypologyMutationResponse"
        "400":
          description: The typology is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The repository is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /typologies/{id}:
    get:
      tags: [Typologies]
      summary: Get an active typology.
      security:
        - TenantHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The active typology.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Typology"
        "404":
          description: The active engine does not have this typology.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Typologies]
      summary: Update a typology and make the changes active immediately.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Typology"
      responses:
        "200":
          description: Osprey updated and loaded the typology.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypologyMutationResponse"
        "400":
          description: The typology is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Typologies]
      summary: Delete a typology and remove it from the active engine.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Osprey deleted the typology and reloaded the engine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The typology does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /typologies/reload:
    post:
      tags: [Typologies]
      summary: Reload typologies from the repository into the active engine.
      security:
        - TenantHeader: []
          AdminBearer: []
        - TenantHeader: []
          AdminHeader: []
      responses:
        "200":
          description: Osprey reloaded the typologies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadResponse"
        "401":
          description: The request needs an admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The repository is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
    AdminHeader:
      type: apiKey
      in: header
      name: X-Osprey-Admin-Token
    AdminBearer:
      type: http
      scheme: bearer
  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Force:
      name: force
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: >-
        If true, Osprey skips the typology reference check when you disable a rule
        that a loaded typology uses. The response then has a `warnings` array
        that names these typologies. The default is false. With false, Osprey
        returns 409 when you disable a rule that a loaded typology uses.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    HealthResponse:
      type: object
      required: [status, version, mode]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
        mode:
          type: string
          enum: [detection, compliance]
    ReadyResponse:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: string
          enum: ["true"]
    NotReadyResponse:
      type: object
      required: [ready, error]
      additionalProperties: false
      properties:
        ready:
          type: string
          enum: ["false"]
        error:
          type: string
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [type, debtor, creditor, amount]
      properties:
        id:
          type: string
          description: An optional transaction ID from the client. If you do not send an ID, Osprey makes one.
        type:
          type: string
          description: The transaction type. Osprey changes it to uppercase.
        debtor:
          $ref: "#/components/schemas/PartyInfo"
        creditor:
          $ref: "#/components/schemas/PartyInfo"
        amount:
          $ref: "#/components/schemas/AmountInfo"
        timestamp:
          type: string
          format: date-time
          description: An optional RFC3339 timestamp for the transaction.
        metadata:
          type: object
          additionalProperties: true
          description: Facts that the caller supplies. Rules get these facts in the `meta` map. Use has() to check for optional keys.
        enrichment:
          type: object
          additionalProperties: true
          description: Scores and flags that an external system calculates, for example ml_score, sanctions_hit, and ring_risk. Rules get these values in the `enrichment` map. The caller asserts these values. Osprey does not verify them.
    PartyInfo:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
        accountId:
          type: string
    AmountInfo:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
    EvaluateResponse:
      type: object
      required: [evaluationId, txId, status, score, metadata]
      properties:
        evaluationId:
          type: string
        txId:
          type: string
        status:
          type: string
          enum: [ALRT, NALT]
        score:
          type: number
        reasons:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/EvaluateResponseMetadata"
    EvaluateResponseMetadata:
      type: object
      required: [traceId, ingestMs, totalMs, version]
      properties:
        traceId:
          type: string
        ingestMs:
          type: integer
        totalMs:
          type: integer
        version:
          type: string
    Transaction:
      type: object
      required:
        - id
        - tenantId
        - type
        - debtorId
        - debtorAccountId
        - creditorId
        - creditorAccountId
        - amount
        - currency
        - timestamp
        - createdAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        type:
          type: string
        debtorId:
          type: string
        debtorAccountId:
          type: string
        creditorId:
          type: string
        creditorAccountId:
          type: string
        amount:
          type: number
        currency:
          type: string
        timestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    Evaluation:
      type: object
      required:
        - id
        - tenantId
        - txId
        - status
        - score
        - timestamp
        - ruleResults
        - metadata
      properties:
        id:
          type: string
        tenantId:
          type: string
        txId:
          type: string
        status:
          type: string
          enum: [ALRT, NALT]
        score:
          type: number
        timestamp:
          type: string
          format: date-time
        ruleResults:
          type: array
          items:
            $ref: "#/components/schemas/RuleResult"
        typologyResults:
          type: array
          items:
            $ref: "#/components/schemas/TypologyResult"
        metadata:
          $ref: "#/components/schemas/EvaluationMetadata"
    EvaluationMetadata:
      type: object
      properties:
        traceId:
          type: string
        ingestMs:
          type: integer
        rulesMs:
          type: integer
        decisionMs:
          type: integer
        totalMs:
          type: integer
        rulesEvaluated:
          type: integer
        typologiesEvaluated:
          type: integer
        engineVersion:
          type: string
    RuleResult:
      type: object
      properties:
        ruleId:
          type: string
        tenantId:
          type: string
        txId:
          type: string
        subRuleRef:
          type: string
        score:
          type: number
        reason:
          type: string
        weight:
          type: number
        processMs:
          type: integer
    RuleContribution:
      type: object
      properties:
        ruleId:
          type: string
        ruleScore:
          type: number
        weight:
          type: number
        contribution:
          type: number
        triggered:
          type: boolean
    TypologyResult:
      type: object
      properties:
        typologyId:
          type: string
        typologyName:
          type: string
        score:
          type: number
        threshold:
          type: number
        triggered:
          type: boolean
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleResult"
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/RuleContribution"
        processMs:
          type: integer
    RuleConfig:
      type: object
      additionalProperties: false
      required: [id, name, expression, weight, enabled]
      properties:
        id:
          type: string
        tenantId:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        version:
          type: string
          readOnly: true
        expression:
          type: string
        bands:
          type: array
          items:
            $ref: "#/components/schemas/RuleBand"
        weight:
          type: number
          minimum: 0
          maximum: 1
        enabled:
          type: boolean
    RuleBand:
      type: object
      additionalProperties: false
      required: [subRuleRef, reason]
      properties:
        lowerLimit:
          type: number
        upperLimit:
          type: number
        subRuleRef:
          type: string
        reason:
          type: string
    ListRulesResponse:
      type: object
      required: [rules, count, source]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleConfig"
        count:
          type: integer
        source:
          type: string
          enum: [active-engine]
    RuleMutationResponse:
      type: object
      required: [rule, message]
      properties:
        rule:
          $ref: "#/components/schemas/RuleConfig"
        message:
          type: string
        warnings:
          type: array
          items:
            type: string
          description: >-
            Osprey includes this field only when the request used `?force=true`
            to skip the typology reference check. The field lists the typologies
            whose scores change while the rule is disabled.
    Typology:
      type: object
      additionalProperties: false
      required: [id, name, alertThreshold, enabled, rules]
      properties:
        id:
          type: string
        tenantId:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        version:
          type: string
          readOnly: true
        alertThreshold:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        enabled:
          type: boolean
        rules:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TypologyRuleWeight"
    TypologyRuleWeight:
      type: object
      additionalProperties: false
      required: [ruleId, weight]
      properties:
        ruleId:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
    ListTypologiesResponse:
      type: object
      required: [typologies, count, source]
      properties:
        typologies:
          type: array
          items:
            $ref: "#/components/schemas/Typology"
        count:
          type: integer
        source:
          type: string
          enum: [active-engine]
    TypologyMutationResponse:
      type: object
      required: [typology, message]
      properties:
        typology:
          $ref: "#/components/schemas/Typology"
        message:
          type: string
    ReloadResponse:
      type: object
      required: [message, count]
      properties:
        message:
          type: string
        count:
          type: integer
